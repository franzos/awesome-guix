name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npx --yes awesome-lint
        env:
          github_token: ${{ secrets.GITHUB_TOKEN }}
